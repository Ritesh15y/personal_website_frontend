<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | Prema Design Studio</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --border: rgba(212, 175, 55, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .badge {
      display: inline-block;
      color: var(--gold);
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--gold);
      font-size: 1.8rem;
      margin-bottom: 16px;
      font-weight: 600;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--gold);
      color: #0a0a0a;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">HTTP 404 · NOT FOUND</div>
    <h1>Blueprint Not Found</h1>
    <p>The page you are looking for does not exist, was removed, or is currently unavailable.</p>
    <a href="/" class="btn">Return to Prema Design Studio</a>
  </div>
</body>
</html>
